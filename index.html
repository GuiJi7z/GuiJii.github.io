<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <title>PELICAN ON THE ROAD · 胶片质感骑行</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #06070a;
        overflow: hidden;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New",
          monospace;
        color: #e9e3d6;
      }
      #c {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #bar {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 14px;
        width: max-content;
        max-width: calc(100vw - 24px);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        padding: 9px 12px;
        background: rgba(10, 11, 14, 0.55);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 14px;
        box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55);
        z-index: 5;
      }
      .grp {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .lbl {
        font-size: 10px;
        opacity: 0.5;
        letter-spacing: 0.14em;
        margin: 0 3px;
      }
      button {
        font: inherit;
        font-size: 11.5px;
        letter-spacing: 0.06em;
        color: #d8d2c6;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 8px;
        padding: 5px 9px;
        transition: 0.16s;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      button.on {
        background: linear-gradient(#ffd77e, #e5a23b);
        color: #241803;
        border-color: #ffd77e;
        font-weight: 700;
      }
      input[type="range"] {
        width: 90px;
        accent-color: #e5a23b;
      }
      #toast {
        position: fixed;
        top: 27%;           /* 天空区：醒目又不遮鹈鹕/道路主体 */
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9;
        font-size: 30px;
        letter-spacing: 0.45em;
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
        text-shadow: 0 4px 24px #000;
        color: #fff;
        white-space: nowrap;
      }
      #err {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 99;
        display: none;
        background: #3a0000ee;
        color: #ffd7d2;
        font:
          12px/1.6 ui-monospace,
          Menlo,
          monospace;
        padding: 12px 16px;
        white-space: pre-wrap;
        max-height: 46vh;
        overflow: auto;
        border-bottom: 2px solid #ff5a4a;
      }
      #err b {
        color: #ff8a7a;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="err"></div>
    <div id="toast"></div>
    <div id="bar">
      <div class="grp">
        <span class="lbl">天气</span>
        <button class="on" data-w="auto">自动</button
        ><button data-w="clear">晴</button><button data-w="rain">雨</button>
        <button data-w="snow">雪</button><button data-w="hail">冰雹</button
        ><button data-w="storm">雷暴</button
        ><button data-w="tor">龙卷风</button>
      </div>
      <div class="grp">
        <span class="lbl">地貌</span>
        <button class="on" data-b="auto">自动</button
        ><button data-b="plain">平原</button
        ><button data-b="grass">草原</button>
        <button data-b="mountain">山地</button
        ><button data-b="canyon">峡谷</button>
      </div>
      <div class="grp">
        <span class="lbl">速度</span
        ><input id="spd" type="range" min="0" max="2.5" step="0.05" value="1" />
        <span id="spdv" style="font-size: 11px; opacity: 0.7; width: 34px"
          >1.0×</span
        >
      </div>
      <div class="grp">
        <button id="pause">暂停</button><button id="snd">音效:关</button
        ><button id="shot">截图</button>
      </div>
    </div>
    <script>
      (function(){
      'use strict';
      /* ===== 0. 错误可见化 ===== */
      var errBox=document.getElementById('err'),lastErr='';
      function fatal(t,e){
        var msg=t+(e&&e.stack?('\n'+String(e.stack).split('\n').slice(0,6).join('\n')):'');
        if(msg===lastErr)return; lastErr=msg;
        errBox.innerHTML='<b>⚠ 运行错误（动画已尽力恢复，请截图此面板）</b>\n'+msg.replace(/&/g,'&amp;').replace(/</g,'&lt;');
        errBox.style.display='block';
      }
      window.addEventListener('error',function(e){fatal('ERROR: '+e.message,e.error);});
      window.addEventListener('unhandledrejection',function(e){fatal('REJECT: '+e.reason);});

      /* ===== 1. 工具（全部防 NaN） ===== */
      var TAU=Math.PI*2;
      function fin(v,d){return (typeof v==='number'&&isFinite(v))?v:(d===undefined?0:d);}
      function clamp(v,a,b){v=fin(v,a);return v<a?a:(v>b?b:v);}
      function lerp(a,b,t){return a+(b-a)*t;}
      function sstep(a,b,x){var t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
      function ihash(i,s){s=s||0;var n=((i|0)*374761393+(s|0)*668265263)|0;n=(n^(n>>>13))|0;n=Math.imul(n,1274126177);return ((n^(n>>>16))>>>0)/4294967295;}
      function ih(i,s,a,b){return a+(b-a)*ihash(i,s);}
      function vn(x,s){s=s||0;var i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(ihash(i,s*131+1),ihash(i+1,s*131+1),u);}
      function fbm(x,s,o){o=o||4;var a=0,am=.5,f=1,n=0,i;for(i=0;i<o;i++){a+=am*vn(x*f,s+i*17);n+=am;am*=.5;f*=2.07;}return a/n;}
      function ridged(x,s,o){o=o||4;var a=0,am=.5,f=1,n=0,i,v;for(i=0;i<o;i++){v=vn(x*f,s+i*29);v=1-Math.abs(v*2-1);a+=am*v*v;n+=am;am*=.5;f*=2.11;}return a/n;}
      function terrace(x,fq,sd,st){var a=fbm(x*fq,sd,4)*st,i=Math.floor(a),f=a-i;return (i+sstep(0,.15,f))/st;}
      function mix(a,b,t){t=clamp(t,0,1);return [lerp(fin(a[0],128),fin(b[0],128),t),lerp(fin(a[1],128),fin(b[1],128),t),lerp(fin(a[2],128),fin(b[2],128),t)];}
      function shade(c,f){return [clamp(c[0]*f,0,255),clamp(c[1]*f,0,255),clamp(c[2]*f,0,255)];}
      function C(c,a){var A=a===undefined?1:clamp(a,0,1);
       return 'rgba('+Math.round(clamp(fin(c[0],128),0,255))+','+Math.round(clamp(fin(c[1],128),0,255))+','+Math.round(clamp(fin(c[2],128),0,255))+','+(Math.round(A*100)/100)+')';}
      /* 安全圆角路径（不依赖 roundRect） */
      function RR(g,x,y,w,h,r){w=Math.max(0,fin(w,0));h=Math.max(0,fin(h,0));r=clamp(fin(r,0),0,Math.min(w,h)/2);
       g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
       g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
      /* 安全渐变 */
      function LG(g,x0,y0,x1,y1){try{return g.createLinearGradient(fin(x0),fin(y0),fin(x1),fin(y1));}catch(e){return g.createLinearGradient(0,0,1,1);}}
      function RG(g,x0,y0,r0,x1,y1,r1){var X=fin(x0),Y=fin(y0),R0=Math.max(0,fin(r0)),X1=fin(x1),Y1=fin(y1),R1=Math.max(R0+.01,fin(r1));
       try{return g.createRadialGradient(X,Y,R0,X1,Y1,R1);}catch(e){return g.createRadialGradient(X,Y,0,X,Y,Math.max(1,R1));}}
      function ST(gr,arr){for(var i=0;i<arr.length;i++){try{gr.addColorStop(clamp(arr[i][0],0,1),C(arr[i][1],arr[i][2]));}catch(e){}}}
      /* 安全 drawImage */
      function blit(g,img,sx,sy,sw,sh,dx,dy,dw,dh){
       sx=Math.max(0,fin(sx));sy=Math.max(0,fin(sy));sw=fin(sw);sh=fin(sh);
       dx=fin(dx);dy=fin(dy);dw=fin(dw);dh=fin(dh);
       if(sw<=0||sh<=0||dw<=0||dh<=0)return;
       var iw=img.width||1,ihh=img.height||1;
       sx=clamp(sx,0,iw-1);sy=clamp(sy,0,ihh-1);sw=Math.min(sw,iw-sx);sh=Math.min(sh,ihh-sy);
       if(sw<=0||sh<=0)return;
       try{g.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);}catch(e){}
      }

      /* ===== 2. 全局状态 ===== */
      var cv=document.getElementById('c');
      var ctx=cv.getContext('2d',{alpha:false});
      var refCv=document.createElement('canvas'),rctx=refCv.getContext('2d');
      var W=0,H=0,DPR=1,horizonY=0,roadBaseY=0,R=54,refScale=.5,groundClamp=1,dx=1,vig=null;
      var grains=[],frames=0,lastT=0,time=0,paused=false,speedMul=1,shake=0,flash=0,darkness=0,lightT=99;
      var camX=0,wind=4,gust=0,torX=0,torOn=false,torDir=1,wMode='auto',bMode='auto',wseqI=0,wseqT=0,curW='clear';

      /* ===== 3. 地貌 ===== */
      var PAL={
      plain:{name:'大平原 · WHEAT PLAINS',sky1:[70,132,205],sky2:[131,180,224],sky3:[216,229,236],far1:[131,148,174],far2:[178,187,200],mid1:[126,156,120],mid2:[188,199,144],g1:[220,193,126],g2:[174,146,86],soil:[140,114,70],road:[198,170,118],tree:[66,106,64]},
      grass:{name:'大草原 · PRAIRIE',sky1:[64,134,208],sky2:[130,182,226],sky3:[224,235,226],far1:[120,148,140],far2:[170,187,158],mid1:[104,146,92],mid2:[152,183,110],g1:[128,170,86],g2:[86,126,62],soil:[96,88,58],road:[180,162,120],tree:[52,92,52]},
      mountain:{name:'落基山脉 · ROCKIES',sky1:[52,110,190],sky2:[118,166,220],sky3:[216,229,238],far1:[108,122,152],far2:[198,208,218],mid1:[96,120,116],mid2:[134,160,150],g1:[152,154,134],g2:[102,106,94],soil:[110,104,92],road:[178,166,142],tree:[40,82,60]},
      canyon:{name:'大峡谷 · CANYON',sky1:[62,124,196],sky2:[148,184,220],sky3:[240,228,206],far1:[178,130,110],far2:[216,172,142],mid1:[178,112,78],mid2:[216,154,104],g1:[208,144,90],g2:[154,96,62],soil:[142,82,52],road:[208,170,122],tree:[74,102,60]}};
      var BORDER=['plain','grass','mountain','canyon'],BLEN={plain:13000,grass:11000,mountain:16000,canyon:14000};
      var SEGS=[],CYCLE=0,TRANS=1800;
      (function(){for(var i=0;i<BORDER.length;i++){SEGS.push({b:BORDER[i],s:CYCLE,e:CYCLE+BLEN[BORDER[i]]});CYCLE+=BLEN[BORDER[i]];}})();
      var manualBiome=null,manualW={plain:0,grass:0,mountain:0,canyon:0};
      function biomeWeights(wx){
       if(manualBiome){manualW.plain=0;manualW.grass=0;manualW.mountain=0;manualW.canyon=0;manualW[manualBiome]=1;return manualW;}
       var w={plain:0,grass:0,mountain:0,canyon:0};
       var x=((fin(wx,0)%CYCLE)+CYCLE)%CYCLE,si=0,i;
       for(i=0;i<SEGS.length;i++)if(x>=SEGS[i].s&&x<SEGS[i].e){si=i;break;}
       var s=SEGS[si],pv=SEGS[(si-1+SEGS.length)%SEGS.length],nx=SEGS[(si+1)%SEGS.length];
       var dS=x-s.s,dE=s.e-x;
       if(dS<TRANS){var t=sstep(0,TRANS,dS);w[pv.b]=1-t;w[s.b]+=t;}
       else if(dE<TRANS){var t2=sstep(0,TRANS,dE);w[s.b]=1-t2;w[nx.b]+=t2;}
       else w[s.b]=1;
       return w;}
      function mixW(w,key){var r=0,g=0,b=0,s=0;
       for(var i=0;i<4;i++){var k=BORDER[i],v=w[k];if(!(v>0))continue;var c=PAL[k][key];r+=c[0]*v;g+=c[1]*v;b+=c[2]*v;s+=v;}
       return s>0?[r/s,g/s,b/s]:[130,130,130];}
      function domBiome(wx){var w=biomeWeights(wx),m=-1,best='plain';for(var i=0;i<4;i++){if(w[BORDER[i]]>m){m=w[BORDER[i]];best=BORDER[i];}}return best;}

      /* ===== 4. 地形 ===== */
      function groundH(wx){wx=fin(wx,0);var w=biomeWeights(wx);
       var h=(fbm(wx*.00055,11,3)-.5)*66;
       h+=(fbm(wx*.0021,23,3)-.5)*(13+w.mountain*44);
       h+=w.mountain*(ridged(wx*.00085,37,4)-.28)*130;
       h+=w.canyon*(terrace(wx,.00042,91,4)-.3)*160;
       h+=w.canyon*(fbm(wx*.0026,95,2)-.5)*26;
       h+=w.grass*(fbm(wx*.0009,51,2)-.5)*26;
       h+=w.plain*(fbm(wx*.0013,71,2)-.5)*22;
       h+=(fbm(wx*.02,131,2)-.5)*3.4;
       return fin(h,0);}
      function groundSurfaceY(wx){return roadBaseY-clamp(groundH(wx),-46,groundClamp);}
      var N=320,gh=new Float32Array(N+1);
      function sampleGround(){dx=W/N;for(var i=0;i<=N;i++)gh[i]=groundSurfaceY(camX+i*dx);}
      function groundYat(sx){var t=clamp(sx/dx,0,N-.001),i=t|0;return lerp(gh[i],gh[i+1],t-i);}

      /* ===== 5. 天气 ===== */
      var WSEQ=[['clear',18],['rain',26],['storm',22],['snow',24],['hail',15],['tor',26]];
      var WNAME={clear:'晴朗',rain:'降雨',snow:'降雪',hail:'冰雹',storm:'雷暴',tor:'龙卷风'};
       var w={rain:0,snow:0,hail:0,storm:0,tor:0},targ={rain:0,snow:0,hail:0,storm:0,tor:0};
      function weatherTargets(dt){
       targ.rain=targ.snow=targ.hail=targ.storm=targ.tor=0;
       var m=wMode;
       if(m==='auto'){wseqT+=dt;if(wseqT>WSEQ[wseqI][1]){wseqT=0;wseqI=(wseqI+1)%WSEQ.length;}m=WSEQ[wseqI][0];}
       curW=m;
       if(m==='rain')targ.rain=1;
       else if(m==='storm'){targ.rain=.8;targ.storm=1;}
       else if(m==='snow')targ.snow=1;
       else if(m==='hail'){targ.hail=1;targ.storm=.5;targ.rain=.3;}
       else if(m==='tor'){targ.tor=1;targ.storm=.6;targ.rain=.25;}
      }

      /* ===== 6. 粒子 ===== */
      var rain=[],snow=[],hail=[],splash=[],ripple=[],puff=[],leaf=[],shard=[],bolts=[];
      function sp(a,m,o){if(a.length<m)a.push(o);else a[(Math.random()*m)|0]=o;}
      function splashAt(x,y){var i;
       for(i=0;i<3;i++)sp(splash,300,{x:x,y:y,vx:ih(i,(x|0)%97,-90,90),vy:ih(i,(x|0)%53,-260,-70),life:.28+Math.random()*.2,m:0});
       if(w.rain>.3&&Math.random()<.5)sp(ripple,140,{x:x,y:y+4,r:2,m:0,life:.55});}
      function updRain(dt){var want=Math.round(w.rain*300+w.storm*120),i,p;
       for(i=rain.length;i<want;i++)sp(rain,460,{x:Math.random()*W,y:Math.random()*H,v:ih(i,3,900,1500),l:ih(i,4,12,26),a:ih(i,5,.25,.7)});
       for(i=rain.length-1;i>=0;i--){p=rain[i];p.y+=p.v*dt;p.x+=wind*2.4*dt;
        if(p.x>W+30)p.x-=W+60;if(p.x<-30)p.x+=W+60;
        if(p.y>groundYat(p.x)){splashAt(p.x,groundYat(p.x));rain.splice(i,1);continue;}
        if(rain.length>want)rain.splice(i,1);}}
      function updSnow(dt){var want=Math.round(w.snow*230),i,p;
       while(snow.length<want){i=snow.length;sp(snow,260,{x:Math.random()*W,y:Math.random()*H,v:ih(i,2,45,110),r:ih(i,7,1.2,3.2),ph:ih(i,6,0,TAU),sw:ih(i,8,.4,1.4)});}
       for(i=snow.length-1;i>=0;i--){p=snow[i];p.y+=p.v*dt;p.ph+=dt*1.6;p.x+=(Math.sin(p.ph)*p.sw+wind*1.6)*dt;
        if(p.y>groundYat(p.x)||snow.length>want)snow.splice(i,1);
        if(p.x<-10)p.x+=W+20;if(p.x>W+10)p.x-=W+20;}}
      function updHail(dt){var want=Math.round(w.hail*150),i,p,q,gy;
       while(hail.length<want){i=hail.length;sp(hail,170,{x:Math.random()*W,y:-Math.random()*H,v:ih(i,9,650,1000),r:ih(i,10,2.2,4.6),b:0});}
       for(i=hail.length-1;i>=0;i--){p=hail[i];p.v+=900*dt;p.y+=p.v*dt;p.x+=wind*2.2*dt;gy=groundYat(p.x);
        if(p.y>gy&&p.y-gy<18){p.y=gy-1;p.v*=-.42;p.b++;p.x+=wind*3;
         for(q=0;q<3;q++)sp(shard,260,{x:p.x,y:gy,vx:ih(q,p.x|0,-160,160),vy:ih(q,(p.x|0)+3,-230,-60),life:.3,m:0});
         splashAt(p.x,gy);
         if(p.b>3){rider.shiver=Math.min(1.6,rider.shiver+.55);rider.beak=Math.max(rider.beak,.7);rider.puff=1;
          for(q=0;q<4;q++)sp(shard,260,{x:W*.31+rider.s*(.2+Math.random()*.6),y:rider.y-rider.s*(2.4+Math.random()*.9),vx:-120+Math.random()*240,vy:-160-Math.random()*160,life:.4,m:0});}
         if(Math.abs(p.v)<40){hail.splice(i,1);continue;}}
        if(p.y>H+30||hail.length>want)hail.splice(i,1);
        if(p.x<-10)p.x+=W+20;if(p.x>W+10)p.x-=W+20;}}
      function updFx(dt){var i,p;
       for(i=splash.length-1;i>=0;i--){p=splash[i];p.m++;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;if(p.m>p.life*60)splash.splice(i,1);}
       for(i=ripple.length-1;i>=0;i--){p=ripple[i];p.m++;p.r+=p.m*.9+p.r*.06;if(p.m>p.life*60)ripple.splice(i,1);}
       for(i=shard.length-1;i>=0;i--){p=shard[i];p.m++;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=1400*dt;if(p.m>p.life*60)shard.splice(i,1);}
       for(i=puff.length-1;i>=0;i--){p=puff[i];p.m++;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=(1-dt*.8);p.r+=p.gr*dt;if(p.m>p.life*60)puff.splice(i,1);}
       for(i=leaf.length-1;i>=0;i--){p=leaf[i];p.m++;p.rot+=p.vr*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;
        if(p.y>groundYat(p.x)+6||p.m>p.life*60)leaf.splice(i,1);}}
      function emitPuff(x,y,vx,vy,r,life,col,g,gr){sp(puff,420,{x:x,y:y,vx:vx,vy:vy,r:r,life:life,m:0,col:col,g:g===undefined?-30:g,gr:gr===undefined?26:gr});}

      /* ===== 7. 骑手 ===== */
      var BASE_SPEED=170,KMH_BASE=22; /* 基准速度 22km/h@170px/s，同时用于速度/里程换算 */
      var rider={x:3000,y:0,h:0,s:54,rot:0,wheelA:0,crankA:0,bob:0,bobTilt:0,eye:1,pupil:0,beak:0,
       blink:2,flap:0,wingN:0,umbrella:0,hat:0,shiver:0,puff:0,shade:0,speed:170,caw:0,bell:0,lean:0};
      function torSide(){if(!torOn)return 0;return clamp((torX-camX)/(W*.5),-1,1);}
      function updateRider(dt){
       var sf=1-w.rain*.1-w.snow*.2-w.hail*.08;
       /* 速度随真实条件动态变化：地形坡度(上坡慢/下坡快) + 风力阵风(顺风助力) */
       var gA=groundSurfaceY(rider.x+80),gB=groundSurfaceY(rider.x-40);
       var slp=clamp((gA-gB)/120,-.5,.5); /* 上坡:gA<gB→slp<0;下坡:slp>0 */

      var cloudSpr={};
      function cloudSprite(dk){var q=Math.round(clamp(dk,0,1)*5);if(cloudSpr[q])return cloudSpr[q];
       var S=224,c=document.createElement('canvas');c.width=c.height=S;var x=c.getContext('2d');
       /* 云由一簇圆组成，底部用椭圆压平：坏天气(q↑)底部更平整、云体更扁平，避免球形团块 */
       var P=[[112,128,52],[168,112,46],[56,116,46],[206,132,30],[16,132,32],[148,88,40],[76,94,38],[214,112,20],[12,108,22],[172,78,26],[52,80,24]];
       for(var i=0;i<P.length;i++){var p=P[i],gd=RG(x,p[0],p[1]-p[2]*.35,0,p[0],p[1],p[2]*1.25);
        var top=mix([253,251,246],[120,128,150],q/5),bot=mix([206,214,230],[56,62,86],q/5);
        ST(gd,[[0,top,.95],[.55,mix(top,bot,.65),.88],[1,bot,0]]);
        x.fillStyle=gd;x.beginPath();x.arc(p[0],p[1],p[2]*1.25,0,TAU);x.fill();}
       if(q>0){x.globalAlpha=q/5*.5;x.fillStyle='rgba(58,64,82,.9)';x.beginPath();x.ellipse(112,150,80,12+(q*2.4),0,0,TAU);x.fill();}

      function cloud(g,x,y,s,dk,al){var im=cloudSprite(dk);

      function drawClouds(g){var st=clamp(w.storm*.8+w.tor*.9+w.rain*.4,0,1);

       var LAY=[[.020,.9,.34],[.045,.62,.26],[.085,.34,.17]];
       for(var li=0;li<3;li++){var p=LAY[li][0],ss=LAY[li][1],hh=LAY[li][2];
        var base=horizonY-H*(.34+li*.10)-H*.04,step=Math.max(60,460*ss*2.4);

        for(var i=i0;i<=i1;i++){var h1=ihash(i,li*7+3),h2=ihash(i,li*7+5),h3=ihash(i,li*7+9);
         if(h3<.26-st*.32)continue;

      var NEARP=.62,NEARSLOT=120;
      function drawNearProps(g){var start=Math.floor((camX*NEARP-W*.3)/NEARSLOT),end=Math.floor((camX*NEARP+W*1.3)/NEARSLOT);
       for(var i=start;i<=end;i++){var wx=i*NEARSLOT,sx=wx-camX*NEARP;
        if(sx<-260||sx>W+260)continue;
        var bw2=biomeWeights(wx),r=ihash(i,71),r2=ihash(i,72);
        var best='plain',bw=0;
        for(var k=0;k<4;k++)if(bw2[BORDER[k]]>bw){bw=bw2[BORDER[k]];best=BORDER[k];}
        var a=sstep(.22,.75,bw);if(a<=.02)continue;
        var y=groundYat(sx)+(1-NEARP)*H*.085,sc=H*.055*(.7+r2*.7);
        g.save();g.globalAlpha=a;
        /* 建筑(barn/windmill/silo)已删除，只保留电线杆(drawPoles)；
           自然物保留，动物丰富化：每个地形加入多种动物 */
        if(best==='mountain'){if(r<.30)pine(g,sx,y,sc*(.8+r*.9),mixW(bw2,'tree'),w.snow);
         else if(r<.42)rock(g,sx,y,sc*.5,mixW(bw2,'soil'),w.snow);
         else if(r<.50)bush(g,sx,y,sc*.6,mixW(bw2,'tree'),w.snow,w.tor);
         else if(r<.60)goat(g,sx,y,sc*.62,i);        /* 山羊 */
         else if(r<.70)deer(g,sx,y,sc*.7,i+3);        /* 鹿 */
         else if(r<.80)elk(g,sx,y,sc*.74,i+6);        /* 驼鹿 */
         else if(r<.88)goat(g,sx,y,sc*.5,i+7);         /* 另一只山羊 */
         else rock(g,sx,y,sc*.3,mixW(bw2,'soil'),w.snow);}
        else if(best==='canyon'){if(r<.28)saguaro(g,sx,y,sc*.85,mix([66,110,64],[30,80,50],r2));
         else if(r<.44)hoodoo(g,sx,y,sc*.9,mixW(bw2,'mid1'));
         else if(r<.54)rock(g,sx,y,sc*.6,mixW(bw2,'mid2'),0);
         else if(r<.64)horse(g,sx,y,sc*.68,i);        /* 野马 */
         else if(r<.73)elk(g,sx,y,sc*.72,i+5);        /* 驼鹿 */
         else if(r<.81)cow(g,sx,y,sc*.6,i+9,[120,104,84]);  /* 野牛 */
         else if(r<.89)goat(g,sx,y,sc*.56,i+11);      /* 山羊 */
         else bush(g,sx,y,sc*.5,[124,110,70],0,w.tor);}
        else if(best==='plain'){if(r<.24)bush(g,sx,y,sc*.6,[120,128,64],0,w.tor);
         else if(r<.38)flowers(g,sx,y,sc*.6);
         else if(r<.50)cow(g,sx,y,sc*.7,i,[206,198,186]);    /* 牛 */
         else if(r<.61)horse(g,sx,y,sc*.74,i+4,[168,118,72]); /* 马 */
         else if(r<.71)bison(g,sx,y,sc*.68,i+2);
         else if(r<.80)deer(g,sx,y,sc*.62,i+10);       /* 鹿 */
         else if(r<.88)bush(g,sx,y,sc*.4,[176,164,88],0,w.tor);
         else rock(g,sx,y,sc*.3,[150,138,112],0);}
        else{if(r<.20)bush(g,sx,y,sc*.55,[70,112,58],w.snow,w.tor);
         else if(r<.36)flowers(g,sx,y,sc*.6);
         else if(r<.50)bison(g,sx,y,sc*.72,i);

      function drawPoles(g){var P=1.25,SP=Math.max(300,920);
       var start=Math.floor((camX*P-W*.4)/SP),end=Math.floor((camX*P+W*1.4)/SP),prev=null;
       for(var i=start;i<=end;i++){var wx=i*SP,sx=wx-camX*P;

        if(prev){g.strokeStyle='rgba(24,20,18,.55)';g.lineWidth=Math.max(1,h*.008);
         for(var o=0;o<2;o++){var oo=o?h*.72:h*.86;
          g.beginPath();g.moveTo(prev.x,prev.y+oo);
          g.quadraticCurveTo((prev.x+sx)/2,(prev.y+y)/2+oo+h*.09,sx,y+oo);g.stroke();}}

      function mirrorStrip(g,x0,x1,wy,alpha,wob){
       g.save();g.globalAlpha=clamp(alpha,0,1);
       g.translate(0,2*wy);g.scale(1,-1);
       blit(g,refCv,x0*refScale,0,(x1-x0)*refScale,refCv.height,
            x0+Math.sin(time*2.2+x0*.06)*wob,0,Math.max(.5,x1-x0),H);
       g.restore();}
      function drawReflections(g){var wet=clamp(w.rain*.8+w.hail*.35,0,1);
       if(wet<.05)return;
       var i;
       g.save();groundPath(g,-1);
       for(i=0;i<=N;i+=2)g.lineTo(i*dx,gh[i]+16);
       g.closePath();g.clip();
       for(var x=0;x<W;x+=14)mirrorStrip(g,x,Math.min(W,x+15),groundYat(x+7),wet*.32,.8);
       g.fillStyle='rgba(150,178,206,'+(wet*.10)+')';g.fillRect(0,0,W,H);
       g.restore();
       var c0=Math.floor(camX/300),c1=Math.floor((camX+W)/300);
       for(var cc=c0;cc<=c1;cc++){if(ihash(cc,93)>.5)continue;
        var sx=cc*300-camX+ih(cc,94,-60,60);
        if(sx<-180||sx>W+180)continue;
        var wy=groundYat(sx)+5,rw=ih(cc,91,54,150),rh=ih(cc,92,5,13);
        var wob=Math.sin(time*1.6+cc)*2;
        g.save();g.beginPath();g.ellipse(sx+wob,wy+rh*.3,rw,rh,0,0,TAU);g.clip();
        for(var px=sx-rw;px<sx+rw;px+=10)mirrorStrip(g,px,px+11,wy,wet*.5,1.6);
        g.fillStyle='rgba(120,150,180,'+(wet*.14)+')';g.fillRect(sx-rw,wy-rh,rw*2,rh*2);
        g.restore();
        g.save();g.globalAlpha=wet*.5;g.strokeStyle='rgba(235,245,255,.9)';g.lineWidth=1;
        g.beginPath();g.ellipse(sx+wob,wy+rh*.3,rw*.92,rh*.9,0,0,TAU);g.stroke();g.restore();}
       for(var i2=0;i2<ripple.length;i2++){var p=ripple[i2];
        g.strokeStyle='rgba(226,240,255,'+clamp(1-p.m/(p.life*60),0,1)*.5+')';g.lineWidth=1;
        g.beginPath();g.ellipse(p.x,p.y,p.r,p.r*.3,0,0,TAU);g.stroke();}}

       for(i=0;i<120;i++){var x=ihash(i,101)*W;g.fillRect(x,groundYat(x)-s*4,1.5,1.5);}
       g.globalAlpha=1;}

      function drawPuffs(g){for(var i=0;i<puff.length;i++){var p=puff[i];

      function drawTornadoBack(g){if(w.tor<.05||!torOn)return;
       var sx=torX-camX;if(sx<-W||sx>W*1.6)return;
       var baseY=groundYat(clamp(sx,0,W))-4,topY=horizonY-H*.34,Hh=baseY-topY,inten=clamp(w.tor,0,1),i,t;
       if(Hh<10)return;
       /* 漏斗剖面：云下宽(楔形) → 中段收窄 → 地面细绳，符合真实龙卷轮廓 */
       var maxWd=150*inten;
       function prof(u){return .92*Math.pow(1-u,1.5)+.10;}
       function cx(u){return sx+Math.sin(u*3.5+time*.8)*26*Math.sin(Math.PI*u)*inten
        +torDir*10*u+Math.sin(u*11+time*2.2)*7*inten;}
       var NSEG=40,lft=[],rgt=[];
       for(i=0;i<=NSEG;i++){t=i/NSEG;var wd=prof(t)*maxWd,x=cx(t),y=lerp(topY,baseY,t);
        lft.push([x-wd,y]);rgt.push([x+wd,y]);}
       /* 1) 整体轮廓 + 垂直渐变，塑造体积 */
       var vg=LG(g,0,topY,0,baseY);
       ST(vg,[[0,[118,128,148],.32*inten],[.45,[98,108,130],.44*inten],[1,[72,80,98],.30*inten]]);
       g.fillStyle=vg;g.beginPath();g.moveTo(lft[0][0],lft[0][1]);
       for(i=1;i<=NSEG;i++)g.lineTo(lft[i][0],lft[i][1]);
       for(i=NSEG;i>=0;i--)g.lineTo(rgt[i][0],rgt[i][1]);
       g.closePath();g.fill();
       /* 2) 环状明暗带：随时间向下滚动，表现涡旋 */
       for(i=0;i<14;i++){var b=((i/14+time*.18)%1);
        var wd=prof(b)*maxWd*.92,x=cx(b),y=lerp(topY,baseY,b),yy=y+Hh/NSEG;
        g.strokeStyle='rgba(202,210,228,'+(clamp(.10+.16*Math.sin(b*6-time*2.4),0,.26)*inten)+')';
        g.lineWidth=Math.max(.8,Hh/NSEG*1.1);
        g.beginPath();g.moveTo(x-wd*.55,yy);g.quadraticCurveTo(x,yy+Hh/NSEG*.5,x+wd*.55,yy);g.stroke();
        g.strokeStyle='rgba(52,60,78,'+(clamp(.12+.14*Math.sin(b*5+time*2.1),0,.24)*inten)+')';
        g.lineWidth=Math.max(.7,Hh/NSEG*.7);
        g.beginPath();g.moveTo(x-wd*.4,yy+2);g.quadraticCurveTo(x,yy+Hh/NSEG*.4,x+wd*.4,yy+2);g.stroke();}
       /* 3) 螺旋细条纹：绕柱盘绕，明示旋转方向与转速 */
       g.save();g.globalAlpha=inten*.55;
       for(var s=0;s<6;s++){var ph=s/6;
        for(var k=0;k<5;k++){var u=(ph+k*.18+time*.16*torDir%1+1)%1;
         var wd=prof(u)*maxWd,x=cx(u),y=lerp(topY,baseY,u);
         var off=Math.sin(ph*6.28+time*(2.2+u*2.6)*torDir)*wd*.6;
         g.strokeStyle='rgba(222,228,242,'+(.16*(1-Math.abs(u-.5)*1.2))+')';
         g.lineWidth=Math.max(.6,Hh/NSEG*.55);
         g.beginPath();g.moveTo(x+off-wd*.35,y);g.lineTo(x+off,y+Hh/NSEG*.8);g.lineTo(x+off+wd*.35,y);g.stroke();}}
       g.restore();
       /* 4) 顶部云领：漏斗与云底的切变连接 */
       var topWd=prof(0)*maxWd,topX=cx(0);
       g.fillStyle='rgba(84,92,110,'+(.30*inten)+')';
       g.beginPath();g.ellipse(topX,topY+2,topWd*1.25,Hh*.05,0,0,TAU);g.fill();
       g.fillStyle='rgba(122,132,152,'+(.22*inten)+')';
       g.beginPath();g.ellipse(topX,topY-Hh*.02,topWd*1.0,Hh*.03,0,0,TAU);g.fill();
       g.save();g.globalAlpha=inten*.8;
       for(var k2=0;k2<5;k2++)cloud(g,topX+(k2-2)*46+Math.sin(time*.7+k2)*16,topY+4,Math.max(6,inten*.8),1,1);
       g.restore();}
      function drawTornadoFront(g){if(w.tor<.05||!torOn)return;
       var sx=torX-camX;if(sx<-W||sx>W*1.6)return;
       var baseY=groundYat(clamp(sx,0,W))-4,inten=clamp(w.tor,0,1),i;
       /* 1) 底部扬尘裙：三圈旋转的土色环，边缘羽化 */
       for(var k=0;k<3;k++){var r=(46+k*46)*inten;
        var gr=RG(g,sx+Math.sin(time*2+k)*20,baseY-r*.3,0,sx,baseY-r*.3,Math.max(1,r));
        ST(gr,[[0,[148,132,110],.32*inten],[1,[148,132,110],0]]);
        g.fillStyle=gr;g.beginPath();g.arc(sx,baseY-r*.3,Math.max(1,r),0,TAU);g.fill();}
       /* 2) 尘土带：环绕柱身旋转的弧形带，底部最浓 */
       g.save();g.globalAlpha=inten;
       for(i=0;i<9;i++){var b=((i/9+time*.34)%1);
        var x=sx+Math.sin(b*6.28+time*1.2)*60*inten*b;
        var y=baseY-H*.30*b*b-8,wd=H*.10*(1-b*.55),a=.14*(1-b*.6);
        g.strokeStyle='rgba(150,138,112,'+(a*inten)+')';g.lineWidth=Math.max(1.2,wd*.22);
        g.beginPath();g.arc(x,y,Math.max(2,wd),(time*2.2*torDir), (time*2.2*torDir+Math.PI*1.2));g.stroke();}
       g.restore();
       /* 3) 环绕碎屑：粒子沿漏斗螺旋上抛 */
       for(i=0;i<20;i++){var t=((i/20+time*.24)%1);
        var th=i*2.39+time*2.6*torDir;
        var rr=190*inten*(t*1.3+.25),x=sx+Math.cos(th)*rr,y=baseY-H*.34*t+Math.sin(th*1.7)*9;
        g.fillStyle='rgba(214,218,228,'+clamp(.30*(1-t*.5)*(.5+.5*Math.sin(th*3+time*4)),0,.30)+')';

       /* 4) 上升尘土柱：中心若隐若现的上升气柱 */
       var up=LG(g,0,baseY-H*.34,0,baseY);
       ST(up,[[0,[140,132,116],.14*inten],[1,[140,132,116],0]]);
       g.fillStyle=up;g.beginPath();
       g.moveTo(sx-8,baseY);g.quadraticCurveTo(sx-20,baseY-H*.18,sx-14,baseY-H*.34);
       g.lineTo(sx+14,baseY-H*.34);g.quadraticCurveTo(sx+22,baseY-H*.18,sx+8,baseY);g.closePath();g.fill();
       if(Math.random()<.5)sp(leaf,60,{x:sx+(Math.random()-.5)*260,y:groundYat(clamp(sx,0,W))-Math.random()*H*.4-40,
        vx:-torDir*(120+Math.random()*260),vy:-40-Math.random()*140,rot:Math.random()*6,vr:(Math.random()-.5)*16,
        life:2.2,col:Math.random()>.5?[120,92,52]:[178,176,160]});}
      function updateTornado(dt){var on=w.tor>.15;
       if(on&&!torOn){torOn=true;torDir=Math.random()<.5?1:-1;torX=camX+W*(Math.random()<.55?1.25:.6);}
       if(!on&&w.tor<.04)torOn=false;
       if(torOn){torX+=(torDir*46+wind*.9*torDir)*dt*(.6+w.tor);
        if(torX<camX-W*.8){torX=camX+W*1.4;}
        if(torX>camX+W*2.0){torDir=-1;torX=camX+W*1.4;}}
       var target=4+w.storm*14+w.rain*4+w.tor*46+Math.sin(time*.7)*3;
       wind+=(target-wind)*Math.min(1,dt*2);}
      function makeBolt(x0,y0,x1,y1){var pts=[],n=16,i,t;
       for(i=0;i<=n;i++){t=i/n;pts.push([lerp(x0,x1,t)+(Math.random()-.5)*46*(1-t*.4),lerp(y0,y1,t)]);}return pts;}
      function updateLightning(dt){lightT-=dt;
       var chance=w.storm*.9+w.tor*.4;
       if(chance>.25&&lightT<=0){lightT=.7+Math.random()*3.2*(1.2-clamp(chance,0,1));
        var x=Math.random()*W*1.1-W*.05;

       for(var i=bolts.length-1;i>=0;i--){bolts[i].m++;if(bolts[i].m>bolts[i].life*60)bolts.splice(i,1);}
       flash=Math.max(0,flash-dt*3.6);shake=Math.max(0,shake-dt*1.9);}
      function drawBolts(g){var i,j;
       for(i=0;i<bolts.length;i++){var b=bolts[i],a=clamp(1-b.m/(b.max*60),0,1),p=b.pts;

      /* ===== 17. 胶片后期 ===== */
      function makeGrain(n){var c=document.createElement('canvas');c.width=c.height=n;
       var x=c.getContext('2d'),id=x.createImageData(n,n),d=id.data,i;

      function post(g){
       g.save();g.globalCompositeOperation='soft-light';
       var gr=LG(g,0,0,0,H);
       ST(gr,[[0,[60,90,140],.30],[.55,[150,140,120],.10],[1,[190,130,70],.28]]);
       g.fillStyle=gr;g.fillRect(0,0,W,H);g.restore();
       if(!vig){vig=RG(g,W/2,H/2,Math.min(W,H)*.30,W/2,H/2,Math.max(W,H)*.78);
        ST(vig,[[0,[0,0,0],0],[.62,[4,4,8],.18],[1,[2,2,5],.62]]);}
       g.fillStyle=vig;g.fillRect(0,0,W,H);
       g.save();g.globalAlpha=.085;
       blit(g,grains[(Math.random()*grains.length)|0],0,0,160,160,(Math.random()*120)|0,(Math.random()*120)|0,W,H);
       g.restore();
       if(Math.random()<.10){g.strokeStyle='rgba(255,255,255,.055)';g.lineWidth=1;
        var x=Math.random()*W;g.beginPath();g.moveTo(x,0);g.lineTo(x+(Math.random()-.5)*8,H);g.stroke();}
       if(Math.random()<.5){g.fillStyle='rgba(255,250,235,.18)';
        for(var k=0;k<3;k++){var px=Math.random()*W,py=Math.random()*H;
         g.beginPath();g.arc(px,py,Math.random()*1.6+.4,0,TAU);g.fill();}}
       if(flash>.01){g.save();g.globalCompositeOperation='lighter';
        g.fillStyle='rgba(190,210,255,'+clamp(flash*flash*.34,0,1)+')';g.fillRect(0,0,W,H);g.restore();}
       var bar=Math.round(H*.035);
       g.fillStyle='rgba(6,6,9,.96)';g.fillRect(0,0,W,bar);g.fillRect(0,H-bar,W,bar);
       g.fillStyle='rgba(255,255,255,.05)';g.fillRect(0,bar,W,1);g.fillRect(0,H-bar-1,W,1);}
      function timecode(){var s=Math.floor(time),m=Math.floor(s/60),h=Math.floor(m/60);
       function p(n){return (n<10?'0':'')+n;}return p(h%24)+':'+p(m%60)+':'+p(s%60)+':'+p(Math.floor((time%1)*24));}
      function hud(g){var pad=Math.max(14,W*.022);g.save();g.textBaseline='top';

      /* ===== 18. 声音 ===== */
      var sound={on:false,ctx:null,master:null,windG:null,rainG:null,osc:null,
       init:function(){if(this.ctx)return;try{
        var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
        var c=new AC();this.ctx=c;var m=c.createGain();m.gain.value=0;this.master=m;m.connect(c.destination);
        var len=Math.floor(c.sampleRate*2),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0),i;
        for(i=0;i<len;i++)d[i]=Math.random()*2-1;
        function mk(type,freq){var s=c.createBufferSource();s.buffer=buf;s.loop=true;
         var f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;
         var g=c.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(m);s.start(0);return g;}
        this.windG=mk('lowpass',420);this.rainG=mk('highpass',1800);
        var o=c.createOscillator();o.type='sawtooth';o.frequency.value=52;
        var og=c.createGain();og.gain.value=0;var lf=c.createBiquadFilter();lf.type='lowpass';lf.frequency.value=260;
        o.connect(lf);lf.connect(og);og.connect(m);o.start(0);this.osc=o;this.on=true;}
       catch(e){this.on=false;this.ctx=null;this.master=null;}},
       update:function(){if(!this.on||!this.ctx)return;var t=this.ctx.currentTime;
        if(this.windG)this.windG.gain.setTargetAtTime(clamp(.02+wind*.005+w.tor*.25,0,1),t,.3);
        if(this.rainG)this.rainG.gain.setTargetAtTime(clamp((w.rain*.2+w.hail*.12)*(w.snow<.3?1:.2),0,1),t,.3);
        if(this.osc)this.osc.frequency.setTargetAtTime(38+fin(rider.speed,0)/BASE_SPEED*44+Math.sin(time*7)*2,t,.1);},
       thunder:function(){if(!this.on||!this.ctx)return;try{
        var c=this.ctx,t=c.currentTime,len=Math.floor(c.sampleRate*2.4);
        var b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0),i;
        for(i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
        var s=c.createBufferSource();s.buffer=b;
        var f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(70,t+2.2);
        var g=c.createGain();g.gain.value=.9;g.gain.exponentialRampToValueAtTime(.001,t+2.4);
        s.connect(f);f.connect(g);g.connect(this.master);s.start(0);}catch(e){}},
       bell:function(){if(!this.on||!this.ctx)return;try{
        var c=this.ctx,t=c.currentTime,i;
        for(i=0;i<2;i++){var o=c.createOscillator();o.type='sine';o.frequency.value=i?2640:1760;
         var g=c.createGain();g.gain.setValueAtTime(.06/(i+1),t);g.gain.exponentialRampToValueAtTime(.0001,t+.5);
         o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.55);}}catch(e){}}};

      /* ===== 19. 主循环 ===== */
      function update(dt){
       weatherTargets(dt);
       var rate=Math.min(1,dt*.5),k;
       for(k in w)w[k]+=(targ[k]-w[k])*rate;
       darkness=clamp(w.storm*.52+w.tor*.46+w.rain*.16-w.snow*.05,0,.82);
       updateTornado(dt);updateLightning(dt);updateRider(dt);
       updRain(dt);updSnow(dt);updHail(dt);updFx(dt);
       camX=fin(rider.x-W*.31,0);
       rider.bell-=dt;if(rider.bell<-7){rider.bell=0;sound.bell();}
       sound.update();}
      function render(){
       sampleGround();
       ctx.setTransform(DPR,0,0,DPR,0,0);
       ctx.save();ctx.translate((Math.random()-.5)*shake*9,(Math.random()-.5)*shake*6);
       drawSky(ctx);drawSun(ctx);drawClouds(ctx);drawBirds(ctx);drawRanges(ctx);
       drawTornadoBack(ctx);drawGround(ctx);drawRoad(ctx);drawGrass(ctx);
       if(w.rain*.8+w.hail*.35>=.05){renderReflection();drawReflections(ctx);}
       drawSnowCover(ctx);
       drawNearProps(ctx);drawLamp(ctx);drawRider(ctx,rider);
       drawPoles(ctx);drawTornadoFront(ctx);
       drawPuffs(ctx);drawLeaves(ctx);drawRain(ctx);drawSnowFx(ctx);drawBolts(ctx);
       ctx.restore();
       post(ctx);hud(ctx);}
      var bellT=8;
      function loop(now){
       requestAnimationFrame(loop);            /* 先排下一帧：单帧异常不会终止动画 */
       try{
        if(!lastT)lastT=now;
        var dt=(now-lastT)/1000;lastT=now;
        if(!(dt>0)||dt>.05)dt=.016; /* 钳制仅用于物理模拟，避免大跳变 */
        if(!paused){
         time+=dt*speedMul;update(dt*speedMul);
        }
        bellT-=dt;if(bellT<0){bellT=7+Math.random()*9;rider.bell=1;sound.bell();}
        render();frames++;
       }catch(err){fatal('RUNTIME: '+(err&&err.message?err.message:err),err);}};

      /* ===== 20. 初始化 + 自检 ===== */
      function resize(){
       DPR=Math.min(window.devicePixelRatio||1,1.75);
       W=Math.max(2,window.innerWidth||1280);H=Math.max(2,window.innerHeight||720);
       cv.width=Math.max(2,Math.round(W*DPR));cv.height=Math.max(2,Math.round(H*DPR));
       cv.style.width=W+'px';cv.style.height=H+'px';
       refScale=Math.min(.55,Math.max(.32,900/Math.max(1,W)));
       refCv.width=Math.max(2,Math.round(W*refScale));refCv.height=Math.max(2,Math.round(H*refScale));
       horizonY=H*.50;roadBaseY=H*.795;groundClamp=(roadBaseY-horizonY)*.62;
       R=clamp(H*.072,28,90);rider.s=R;dx=W/N;vig=null;}
      function selftest(){
       var msg=[],i;
       if(!ctx)return '无法获取2D 上下文';
       if(W<200||H<200)msg.push('窗口尺寸异常 '+W+'x'+H);
       if(cv.width<200||cv.height<200)msg.push('画布尺寸异常 '+cv.width+'x'+cv.height);
       var need={'drawSky':drawSky,'drawRanges':drawRanges,'drawGround':drawGround,'drawRoad':drawRoad,
        'drawGrass':drawGrass,'drawNearProps':drawNearProps,'drawPoles':drawPoles,
        'renderReflection':renderReflection,'drawReflections':drawReflections,'drawSnowCover':drawSnowCover,
        'drawLamp':drawLamp,'drawRider':drawRider,'drawTornadoBack':drawTornadoBack,'drawTornadoFront':drawTornadoFront,
        'drawRain':drawRain,'drawSnowFx':drawSnowFx,'drawBolts':drawBolts,'post':post,'hud':hud,'update':update,
        'sampleGround':sampleGround};
       for(i in need){if(Object.prototype.hasOwnProperty.call(need,i)&&typeof need[i]!=='function')msg.push('缺函数 '+i);}
       try{ctx.fillStyle='#123';ctx.fillRect(0,0,2,2);}catch(e){msg.push('画布不可写: '+e.message);}
       if(msg.length){var box=document.getElementById('err');
        box.innerHTML='<b>⚠ 自检未通过</b>\n'+msg.join('\n');
        box.style.display='block';}
       else{
        try{time=.5;render();}catch(e){fatal('首次渲染失败: '+e.message,e);}}}
      function boot(){
       try{
        resize();
        window.addEventListener('resize',function(){try{resize();}catch(e){fatal('resize: '+e.message,e);}});
        var i;for(i=0;i<4;i++)grains.push(makeGrain(160));
        camX=rider.x-W*.31;sampleGround();rider.y=groundYat(W*.31);
        selftest();
        if(typeof requestAnimationFrame==='function')requestAnimationFrame(loop);
        else{var t0=performance.now();(function step(){var n=performance.now();try{
       var dt=Math.min(.05,(n-(step.last||n))/1000);step.last=n;
          if(!paused){time+=dt;update(dt);}render();frames++;}
       catch(e){fatal('RUNTIME: '+e.message,e);}
         setTimeout(step,16);})();}
       }catch(e){fatal('BOOT: '+e.message,e);}}

      /* ===== 21. UI ===== */
      var toast=document.getElementById('toast'),toastT=0;
      function showToast(t){toast.textContent=t;toast.style.opacity=1;toastT=1.6;}
      function setOn(attr,val){var n=document.querySelectorAll('['+attr+']');
       for(var i=0;i<n.length;i++){if(n[i].getAttribute(attr)===val)n[i].className=n[i].className.replace(/\bon\b/g,'').trim()+' on';else n[i].className=n[i].className.replace(/\bon\b/g,'').trim();}}
      var wBtns=document.querySelectorAll('[data-w]');
      for(var i=0;i<wBtns.length;i++)(function(b){
       b.onclick=function(){wMode=b.getAttribute('data-w');if(wMode!=='auto')wseqT=0;
        setOn('data-w',wMode);sound.init();showToast(WNAME[wMode==='auto'?'clear':wMode]||'自动天气');};
      })(wBtns[i]);
      var bBtns=document.querySelectorAll('[data-b]');
      for(i=0;i<bBtns.length;i++)(function(b){
       b.onclick=function(){var m=b.getAttribute('data-b');bMode=m;manualBiome=(m==='auto')?null:m;
        setOn('data-b',m);sound.init();showToast(m==='auto'?'自动地貌':PAL[m].name.split(' ')[0]);};
      })(bBtns[i]);
      var pauseBtn=document.getElementById('pause');
      pauseBtn.onclick=function(){paused=!paused;pauseBtn.textContent=paused?'继续':'暂停';
       pauseBtn.className=paused?'on':'';};
      var sndBtn=document.getElementById('snd');
      sndBtn.onclick=function(){sound.init();var on=sound.master&&sound.master.gain.value>0;
       if(sound.master){try{sound.master.gain.value=on?0:.5;}catch(e){}}
       sndBtn.textContent=on?'音效:关':'音效:开';sndBtn.className=on?'':'on';};
      document.getElementById('shot').onclick=function(){try{
       var a=document.createElement('a');a.download='pelican_'+Date.now()+'.png';a.href=cv.toDataURL('image/png');a.click();
       showToast('已保存');}catch(e){fatal('截图失败: '+e.message,e);}};
      var spd=document.getElementById('spd'),spdv=document.getElementById('spdv');
      spd.oninput=function(){speedMul=+spd.value;spdv.textContent=speedMul.toFixed(1)+'×';};
      window.addEventListener('keydown',function(e){
       var ks=['clear','rain','snow','hail','storm','tor'];
       if(e.code==='Space'){e.preventDefault();pauseBtn.click();}
       else if(e.key>='1'&&e.key<='6'){var b=document.querySelector('[data-w="'+ks[+e.key-1]+'"]');if(b)b.click();}
       else if(e.key==='q'||e.key==='Q'){var b2=document.querySelector('[data-b="plain"]');if(b2)b2.click();}
       else if(e.key==='w'||e.key==='W'){var b3=document.querySelector('[data-b="mountain"]');if(b3)b3.click();}
       else if(e.key==='s'||e.key==='S'){document.getElementById('shot').click();}
       else if(e.key==='ArrowUp'){spd.value=Math.min(2.5,+spd.value+.1);spd.oninput();}
       else if(e.key==='ArrowDown'){spd.value=Math.max(0,+spd.value-.1);spd.oninput();}});
      setInterval(function(){if(toastT>0){toastT-=.05;toast.style.opacity=Math.max(0,toastT/1.6);}},50);
      boot();
      })();
    </script>
  </body>
</html>
